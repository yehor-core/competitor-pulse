name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: competitor_pulse
          POSTGRES_PASSWORD: competitor_pulse
          POSTGRES_DB: competitor_pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U competitor_pulse"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://competitor_pulse:competitor_pulse@localhost:5432/competitor_pulse
      TEST_DATABASE_URL: postgres://competitor_pulse:competitor_pulse@localhost:5432/competitor_pulse
      SOURCE_BASE_URL: http://localhost:4002
      LLM_BASE_URL: http://localhost:4001/v1
      LLM_API_KEY: mock-key
      LLM_MODEL: mock-llm
      POLL_INTERVAL_SECONDS: '900'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations apply on a clean database
        run: npm run migrate -w backend
      - run: npm test

  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  e2e:
    runs-on: ubuntu-latest
    env:
      # Short enough that a scenario sees a poll within seconds.
      POLL_INTERVAL_SECONDS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose up --build --detach
      - name: Wait for the system to be healthy
        run: |
          for url in http://localhost:8080/ http://localhost:8080/api/competitors http://localhost:4002/health; do
            timeout 120 sh -c "until curl --fail --silent $url > /dev/null; do sleep 2; done"
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - run: docker compose down --volumes
        if: always()
